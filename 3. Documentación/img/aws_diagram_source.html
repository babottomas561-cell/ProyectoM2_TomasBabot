<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; background:#fff; font-family: Arial, Helvetica, sans-serif; }
  svg text { font-family: Arial, Helvetica, sans-serif; }
</style></head>
<body>
<svg width="1600" height="1010" viewBox="0 0 1600 1010" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <style>
      .t  { font-size:15px; font-weight:bold; fill:#111; }
      .s  { font-size:12px; fill:#333; }
      .xs { font-size:11px; fill:#555; }
      .lab{ font-size:11.5px; fill:#222; }
      .num{ font-size:12px; font-weight:bold; fill:#fff; }
      .ln { stroke:#333; stroke-width:1.8; fill:none; marker-end:url(#a); }
      .dl { stroke:#888; stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#g); }
    </style>
  </defs>

  <!-- Título -->
  <text x="30" y="40" font-size="24" font-weight="bold" fill="#111">FleetLogix: Arquitectura en AWS (región us-east-1)</text>
  <text x="30" y="64" class="s">Tiempo real: API Gateway + Lambda + DynamoDB · Transaccional: RDS PostgreSQL · Analítico: ETL diario a Snowflake · Costo estimado ≈ US$ 35/mes (tope US$ 50)</text>

  <!-- Usuarios -->
  <rect x="30" y="170" width="200" height="110" rx="10" fill="#F2F2F2" stroke="#666"/>
  <text x="130" y="200" class="t" text-anchor="middle">App móvil</text>
  <text x="130" y="220" class="s" text-anchor="middle">200 conductores</text>
  <text x="130" y="240" class="xs" text-anchor="middle">GPS cada 60 s</text>
  <text x="130" y="258" class="xs" text-anchor="middle">confirma entregas</text>

  <rect x="30" y="460" width="200" height="90" rx="10" fill="#F2F2F2" stroke="#666"/>
  <text x="130" y="492" class="t" text-anchor="middle">Supervisores</text>
  <text x="130" y="512" class="s" text-anchor="middle">reciben alertas</text>
  <text x="130" y="530" class="xs" text-anchor="middle">mail / SMS</text>

  <rect x="1330" y="860" width="240" height="90" rx="10" fill="#F2F2F2" stroke="#666"/>
  <text x="1450" y="892" class="t" text-anchor="middle">Analistas / Gerencia</text>
  <text x="1450" y="912" class="s" text-anchor="middle">tableros y reportes</text>
  <text x="1450" y="930" class="xs" text-anchor="middle">(roles Ventas / Operaciones)</text>

  <!-- Nube AWS -->
  <rect x="270" y="90" width="1020" height="890" rx="14" fill="#FFFBF5" stroke="#E07B00" stroke-width="2"/>
  <text x="290" y="116" font-size="15" font-weight="bold" fill="#E07B00">AWS Cloud</text>

  <!-- Bloque tiempo real -->
  <text x="300" y="145" font-size="13" font-weight="bold" fill="#8A5A00">1. OPERACIÓN EN TIEMPO REAL (serverless, sin VPC → sin costo de NAT)</text>

  <rect x="300" y="190" width="170" height="130" rx="10" fill="#EFE7F9" stroke="#7B4FBF"/>
  <text x="385" y="218" class="t" text-anchor="middle">API Gateway</text>
  <text x="385" y="238" class="s" text-anchor="middle">HTTP API · HTTPS</text>
  <text x="385" y="256" class="xs" text-anchor="middle">POST /deliveries/verify</text>
  <text x="385" y="272" class="xs" text-anchor="middle">POST /vehicles/eta</text>
  <text x="385" y="288" class="xs" text-anchor="middle">POST /vehicles/location</text>
  <text x="385" y="306" class="xs" text-anchor="middle">límite de pedidos (throttling)</text>

  <rect x="540" y="160" width="230" height="56" rx="8" fill="#FDEBD3" stroke="#E07B00"/>
  <text x="655" y="183" class="t" text-anchor="middle">λ verificar-entrega</text>
  <text x="655" y="202" class="xs" text-anchor="middle">¿la entrega está completada?</text>
  <rect x="540" y="228" width="230" height="56" rx="8" fill="#FDEBD3" stroke="#E07B00"/>
  <text x="655" y="251" class="t" text-anchor="middle">λ calcular-eta</text>
  <text x="655" y="270" class="xs" text-anchor="middle">distancia Haversine + hora de llegada</text>
  <rect x="540" y="296" width="230" height="56" rx="8" fill="#FDEBD3" stroke="#E07B00"/>
  <text x="655" y="319" class="t" text-anchor="middle">λ alerta-desvio</text>
  <text x="655" y="338" class="xs" text-anchor="middle">¿se alejó más de 5 km de la ruta?</text>

  <rect x="850" y="160" width="250" height="196" rx="10" fill="#E3EEFB" stroke="#2F6DB5"/>
  <text x="975" y="186" class="t" text-anchor="middle">DynamoDB (on-demand)</text>
  <text x="975" y="204" class="xs" text-anchor="middle">cifrado · se paga por uso</text>
  <text x="868" y="232" class="s">• deliveries_status</text>
  <text x="868" y="254" class="s">• vehicle_tracking (TTL 90 días)</text>
  <text x="868" y="276" class="s">• routes_waypoints</text>
  <text x="868" y="298" class="s">• alerts_history</text>
  <text x="868" y="326" class="xs">lectura por clave en milisegundos</text>
  <text x="868" y="342" class="xs">estado "en vivo" de la flota</text>

  <rect x="540" y="440" width="230" height="70" rx="10" fill="#EFE7F9" stroke="#7B4FBF"/>
  <text x="655" y="468" class="t" text-anchor="middle">SNS fleetlogix-alerts</text>
  <text x="655" y="488" class="xs" text-anchor="middle">publica la alerta de desvío</text>

  <!-- Bloque transaccional y analítico -->
  <line x1="290" y1="560" x2="1270" y2="560" stroke="#E0C9A6" stroke-dasharray="6 5"/>
  <text x="300" y="590" font-size="13" font-weight="bold" fill="#8A5A00">2. DATOS TRANSACCIONALES Y ANALÍTICOS (VPC privada)</text>

  <rect x="300" y="610" width="940" height="200" rx="12" fill="none" stroke="#2E8B57" stroke-dasharray="7 5"/>
  <text x="452" y="630" class="xs" fill="#2E8B57">VPC: RDS en subred privada · EC2 en subred pública</text>

  <rect x="320" y="645" width="240" height="150" rx="10" fill="#E3EEFB" stroke="#2F6DB5"/>
  <text x="440" y="672" class="t" text-anchor="middle">RDS PostgreSQL 16</text>
  <text x="440" y="692" class="s" text-anchor="middle">db.t3.micro · 20 GB gp3</text>
  <text x="440" y="712" class="xs" text-anchor="middle">6 tablas operativas (505 mil filas)</text>
  <text x="440" y="730" class="xs" text-anchor="middle">no pública · cifrada (KMS)</text>
  <text x="440" y="748" class="xs" text-anchor="middle">backups automáticos 7 días</text>
  <text x="440" y="766" class="xs" text-anchor="middle">+ snapshot manual inicial</text>
  <text x="440" y="784" class="xs" text-anchor="middle">clave en Secrets Manager</text>

  <rect x="640" y="645" width="250" height="150" rx="10" fill="#FDEBD3" stroke="#E07B00"/>
  <text x="765" y="672" class="t" text-anchor="middle">EC2 t4g.micro</text>
  <text x="765" y="692" class="s" text-anchor="middle">ETL diario (cron 02:00)</text>
  <text x="765" y="712" class="xs" text-anchor="middle">05_etl_pipeline.py</text>
  <text x="765" y="730" class="xs" text-anchor="middle">extrae de RDS → transforma</text>
  <text x="765" y="748" class="xs" text-anchor="middle">→ carga en Snowflake</text>
  <text x="765" y="766" class="xs" text-anchor="middle">también es el "bastion" para</text>
  <text x="765" y="784" class="xs" text-anchor="middle">migrar la base local a RDS</text>

  <rect x="970" y="645" width="250" height="150" rx="10" fill="#E5F4EA" stroke="#2E8B57"/>
  <text x="1095" y="672" class="t" text-anchor="middle">S3 fleetlogix-data</text>
  <text x="1095" y="692" class="s" text-anchor="middle">cifrado · privado · versionado</text>
  <text x="988" y="716" class="xs">raw-data/  → IA a 30 d, Glacier a 90 d</text>
  <text x="988" y="734" class="xs">processed-data/</text>
  <text x="988" y="752" class="xs">backups/   (pg_dump semanal)</text>
  <text x="988" y="770" class="xs">logs/      (se borran al año)</text>

  <!-- Snowflake -->
  <rect x="1330" y="645" width="240" height="150" rx="10" fill="#E2F3FA" stroke="#1B9BD7" stroke-width="1.6"/>
  <text x="1450" y="672" class="t" text-anchor="middle">Snowflake (externo a AWS)</text>
  <text x="1450" y="692" class="s" text-anchor="middle">FLEETLOGIX_DW.ANALYTICS</text>
  <text x="1450" y="712" class="xs" text-anchor="middle">modelo estrella: 6 dimensiones</text>
  <text x="1450" y="730" class="xs" text-anchor="middle">+ fact_deliveries</text>
  <text x="1450" y="748" class="xs" text-anchor="middle">warehouse XS auto-suspend 60 s</text>
  <text x="1450" y="766" class="xs" text-anchor="middle">Time Travel 30 días</text>
  <text x="1450" y="784" class="xs" text-anchor="middle">vistas seguras por rol</text>
  

  <!-- Transversal -->
  <text x="300" y="852" font-size="13" font-weight="bold" fill="#8A5A00">3. SEGURIDAD Y MONITOREO</text>
  <rect x="300" y="870" width="225" height="90" rx="10" fill="#F3F3F3" stroke="#777"/>
  <text x="412" y="896" class="t" text-anchor="middle">CloudWatch</text>
  <text x="412" y="916" class="xs" text-anchor="middle">logs de las Lambda y del ETL</text>
  <text x="412" y="932" class="xs" text-anchor="middle">métricas + 8 alarmas</text>
  <text x="412" y="948" class="xs" text-anchor="middle">(errores, latencia, CPU RDS)</text>
  <rect x="545" y="870" width="225" height="90" rx="10" fill="#F3F3F3" stroke="#777"/>
  <text x="657" y="896" class="t" text-anchor="middle">IAM</text>
  <text x="657" y="916" class="xs" text-anchor="middle">rol de Lambda con permisos</text>
  <text x="657" y="932" class="xs" text-anchor="middle">mínimos por tabla y acción</text>
  <text x="657" y="948" class="xs" text-anchor="middle">sin "FullAccess"</text>
  <rect x="790" y="870" width="225" height="90" rx="10" fill="#F3F3F3" stroke="#777"/>
  <text x="902" y="896" class="t" text-anchor="middle">KMS + Secrets Manager</text>
  <text x="902" y="916" class="xs" text-anchor="middle">cifrado en reposo (RDS, S3,</text>
  <text x="902" y="932" class="xs" text-anchor="middle">DynamoDB) y en tránsito (TLS)</text>
  <text x="902" y="948" class="xs" text-anchor="middle">claves fuera del código</text>
  <rect x="1035" y="870" width="225" height="90" rx="10" fill="#F3F3F3" stroke="#777"/>
  <text x="1147" y="896" class="t" text-anchor="middle">AWS Budgets</text>
  <text x="1147" y="916" class="xs" text-anchor="middle">aviso al 80% de US$ 50</text>
  <text x="1147" y="932" class="xs" text-anchor="middle">etiquetas Project=FleetLogix</text>
  <text x="1147" y="948" class="xs" text-anchor="middle">para ver el costo por servicio</text>

  <!-- Flechas tiempo real -->
  <path class="ln" d="M230,225 L298,240"/>
  <circle cx="262" cy="214" r="10" fill="#333"/><text x="262" y="218" class="num" text-anchor="middle">1</text>

  <path class="ln" d="M470,225 L538,188"/>
  <path class="ln" d="M470,255 L538,256"/>
  <path class="ln" d="M470,285 L538,324"/>
  <circle cx="503" cy="185" r="10" fill="#333"/><text x="503" y="189" class="num" text-anchor="middle">2</text>

  <path class="ln" d="M770,188 L848,200"/>
  <text x="786" y="180" class="lab">GetItem</text>
  <path class="ln" d="M770,256 L848,258"/>
  <text x="786" y="249" class="lab">PutItem</text>
  <path class="ln" d="M770,324 L848,310"/>
  <text x="780" y="342" class="lab">Get + Put</text>
  <circle cx="815" cy="225" r="10" fill="#333"/><text x="815" y="229" class="num" text-anchor="middle">3</text>

  <path class="ln" d="M655,352 L655,438"/>
  <text x="664" y="400" class="lab">si desvío &gt; 5 km</text>
  <circle cx="640" cy="395" r="10" fill="#333"/><text x="640" y="399" class="num" text-anchor="middle">4</text>
  <path class="ln" d="M540,480 L232,500"/>
  <text x="330" y="478" class="lab">mail / SMS</text>

  <!-- API → RDS (altas de viajes y entregas) -->
  <path class="ln" d="M385,320 L385,535 L440,535 L440,643"/>
  <text x="394" y="420" class="lab">altas de viajes</text>
  <text x="394" y="436" class="lab">y entregas (backend)</text>
  <circle cx="370" cy="390" r="10" fill="#333"/><text x="370" y="394" class="num" text-anchor="middle">5</text>

  <!-- Flechas analíticas -->
  <path class="ln" d="M560,720 L638,720"/>
  <text x="566" y="712" class="lab">lee (SQL)</text>
  <circle cx="598" cy="740" r="10" fill="#333"/><text x="598" y="744" class="num" text-anchor="middle">6</text>
  <path class="ln" d="M890,700 L968,700"/>
  <text x="898" y="692" class="lab">extracto</text>
  <path class="ln" d="M890,760 L968,760"/>
  <text x="898" y="752" class="lab">backup</text>
  <path class="ln" d="M765,645 L765,622 L1450,622 L1450,643"/>
  <text x="1305" y="614" class="lab">carga (write_pandas, TLS)</text>
  <circle cx="1290" cy="622" r="10" fill="#333"/><text x="1290" y="626" class="num" text-anchor="middle">7</text>
  <path class="ln" d="M1450,795 L1450,858"/>
  <circle cx="1470" cy="826" r="10" fill="#333"/><text x="1470" y="830" class="num" text-anchor="middle">8</text>

  <!-- DynamoDB → S3 (export histórico) -->
  <path class="dl" d="M1100,300 L1180,300 L1180,643"/>
  <text x="1188" y="420" class="lab">exportación</text>
  <text x="1188" y="436" class="lab">mensual del</text>
  <text x="1188" y="452" class="lab">historial GPS</text>

  <!-- Logs a CloudWatch -->
  <path class="dl" d="M540,340 L284,340 L284,915 L298,915"/>
  <path class="dl" d="M700,795 L700,828 L535,828 L535,915 L529,915"/>

  <!-- Leyenda -->
  <rect x="1330" y="160" width="240" height="300" rx="10" fill="#FAFAFA" stroke="#BBB"/>
  <text x="1345" y="186" class="t">Flujos</text>
  <text x="1345" y="210" class="xs">1  La app envía GPS y entregas (HTTPS)</text>
  <text x="1345" y="230" class="xs">2  API Gateway invoca la Lambda</text>
  <text x="1345" y="250" class="xs">3  La Lambda lee/escribe DynamoDB</text>
  <text x="1345" y="270" class="xs">4  Desvío → SNS avisa al supervisor</text>
  <text x="1345" y="290" class="xs">5  Viajes y entregas se guardan en RDS</text>
  <text x="1345" y="310" class="xs">6  A las 02:00 el ETL lee RDS</text>
  <text x="1345" y="330" class="xs">7  …y carga el modelo en Snowflake</text>
  <text x="1345" y="350" class="xs">8  Los analistas consultan Snowflake</text>
  <line x1="1345" y1="372" x2="1385" y2="372" stroke="#333" stroke-width="1.8"/>
  <text x="1392" y="376" class="xs">flujo de datos</text>
  <line x1="1345" y1="394" x2="1385" y2="394" stroke="#888" stroke-dasharray="5 4"/>
  <text x="1392" y="398" class="xs">logs / exportación periódica</text>
  <text x="1345" y="424" class="xs">λ = función Lambda</text>
  <text x="1345" y="442" class="xs">IA = S3 Standard-Infrequent Access</text>
</svg>
</body></html>
